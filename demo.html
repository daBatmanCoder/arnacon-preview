<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Arnacon — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b14;
      --ink: #f4f1fb;
      --muted: #9aa3b8;
      --line: rgba(255,255,255,.08);
      --app: #0d0b12;
      --app-2: #111016;
      --card: #1a1820;
      --violet: #8B5CF6;
      --violet-2: #A855F7;
      --magenta: #D946A6;
      --green: #1E7A3C;
      --red: #F03A2F;
      --grey: #8a8a94;
      --ios: https://apps.apple.com/nl/app/arnacon/id6504406464?l=en-GB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 500px at 80% -10%, rgba(139,92,246,.22), transparent 60%),
        radial-gradient(700px 400px at 10% 20%, rgba(59,130,246,.08), transparent 55%);
    }
    a { color: inherit; text-decoration: none; }
    nav {
      position: sticky; top: 14px; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      width: min(1180px, calc(100% - 40px)); margin: 14px auto 0;
      padding: 10px 12px 10px 18px;
      background: rgba(10,14,24,.62);
      border: 1px solid var(--line);
      border-radius: 999px;
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.02em; }
    .mark {
      width: 28px; height: 28px; border-radius: 8px;
      object-fit: cover; background: none;
      box-shadow: 0 0 0 1px rgba(255,255,255,.12);
    }
    .nav-cta { display: flex; align-items: center; gap: 8px; }
    .ghost, .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 14px;
      white-space: nowrap;
    }
    .ghost { color: var(--muted); }
    .ghost:hover { color: white; }
    .btn {
      color: white;
      background: linear-gradient(180deg, #a78bfa, #7c3aed);
      box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 10px 30px rgba(139,92,246,.45);
    }
    .stage {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px 32px;
    }
    .stage-copy { text-align: center; max-width: 36ch; margin-bottom: 22px; }
    .stage-copy h1 { font-size: 28px; letter-spacing: -.03em; font-weight: 650; }
    .stage-copy p { color: var(--muted); margin-top: 8px; font-size: 15px; }
    .stores { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:14px; overflow:visible; }
    .stores a { display:flex; align-items:center; height:44px; overflow:hidden; }
    .stores img { height:44px; width:auto; display:block; }
    .stores a:last-child img { height:64px; margin-top:-10px; margin-bottom:-10px; }
    .phone-wrap {
      position: relative;
      width: min(360px, calc(100vw - 32px), calc((100dvh - 270px) * 390 / 844));
      aspect-ratio: 390 / 844;
      height: auto;
      max-height: calc(100dvh - 270px);
    }
    .phone {
      width: 100%; height: 100%;
      border-radius: 46px;
      background: #000;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 50px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(139,92,246,.2), inset 0 0 0 10px #05070d;
      overflow: hidden; position: relative;
      isolation: isolate;
    }
    .island {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 34px; background: #000; border-radius: 20px; z-index: 8; pointer-events: none;
    }
    #view { flex: 1; min-height: 0; min-width: 0; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .app {
      position: absolute; inset: 10px; border-radius: 36px;
      background: var(--app); overflow: hidden;
      display: flex; flex-direction: column;
      min-width: 0; width: auto;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Instrument Sans", sans-serif;
      color: #fff;
    }
    .app:has(.drawer.on) #view { visibility: hidden; }
    .statusbar {
      height: 48px; display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 22px 8px; font-size: 14px; font-weight: 600; flex-shrink: 0;
    }
    .sb-right { display: flex; gap: 6px; align-items: center; opacity: .9; font-size: 11px; }
    .idbar {
      display: flex; align-items: center; justify-content: center;
      padding: 4px 16px 10px; position: relative; flex-shrink: 0;
    }
    .idbar .ident {
      color: var(--violet-2); font-weight: 600; font-size: 16px;
      max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ham {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(139,92,246,.45);
      background: rgba(26,24,32,.7);
      display: grid; place-items: center; cursor: pointer;
    }
    .ham span, .ham span::before, .ham span::after {
      display: block; width: 14px; height: 1.5px; background: var(--violet-2); border-radius: 2px; position: relative;
    }
    .ham span::before, .ham span::after { content: ""; position: absolute; left: 0; }
    .ham span::before { top: -5px; }
    .ham span::after { top: 5px; }
    .thread-nav {
      display: flex; align-items: center; justify-content: center;
      padding: 6px 16px 10px; position: relative; flex-shrink: 0;
    }
    .thread-nav .who { font-weight: 600; font-size: 16px; }
    .icon-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; display: grid; place-items: center;
      background: none; border: 0; color: #fff; cursor: pointer;
    }
    .icon-btn.left { left: 8px; }
    .icon-btn.right { right: 8px; }
    .list { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
    .row {
      display: grid; grid-template-columns: 44px minmax(0,1fr) auto 36px;
      gap: 8px; align-items: center;
      padding: 10px 14px; cursor: pointer;
      min-width: 0;
    }
    .row > div:nth-child(2) { min-width: 0; overflow: hidden; }
    .row:active { background: rgba(255,255,255,.04); }
    .avatar {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--violet); color: #fff;
      display: grid; place-items: center; font-weight: 700; font-size: 20px;
    }
    .row .name { font-weight: 650; font-size: 15px; }
    .row .snip { color: var(--grey); font-size: 13px; margin-top: 2px; }
    .row .when { color: var(--grey); font-size: 12px; }
    .call-mini {
      width: 34px; height: 34px; border-radius: 10px; background: var(--card);
      display: grid; place-items: center; color: var(--violet-2); border: 0; cursor: pointer;
    }
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      padding: 8px 0 calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,.06);
      background: var(--app-2); flex-shrink: 0;
    }
    .tab {
      background: none; border: 0; color: var(--grey);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .tab.on { color: var(--violet-2); }
    .thread { flex: 1; overflow-y: auto; padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    .chip {
      align-self: center; background: var(--card); color: var(--grey);
      font-size: 12px; padding: 4px 10px; border-radius: 999px;
    }
    .pill {
      align-self: center; background: var(--card); color: #c4b5fd;
      font-size: 12px; padding: 6px 14px; border-radius: 999px;
      border: 1px solid rgba(139,92,246,.25);
    }
    .pill small { display: block; text-align: center; color: var(--grey); font-size: 10px; margin-top: 2px; border: 0; }
    .bubble { max-width: 78%; padding: 10px 12px 18px; border-radius: 16px; font-size: 15px; position: relative; line-height: 1.35; }
    .bubble .from { color: var(--violet-2); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .bubble .t { position: absolute; right: 10px; bottom: 4px; font-size: 10px; color: rgba(255,255,255,.55); }
    .out { align-self: flex-end; background: linear-gradient(180deg, #A855F7, #8B5CF6); }
    .in { align-self: flex-start; background: var(--card); }
    .composer {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--app); flex-shrink: 0;
    }
    .cam, .send {
      width: 40px; height: 40px; border: 0; cursor: pointer; color: #fff;
      background: var(--violet); display: grid; place-items: center; flex-shrink: 0;
    }
    .cam { border-radius: 12px; }
    .send { border-radius: 50%; }
    .composer input {
      flex: 1; height: 40px; border-radius: 999px; border: 0;
      background: var(--card); color: #fff; padding: 0 16px; font-size: 15px; outline: none;

    .dialer { flex: 1; display: flex; flex-direction: column; padding: 8px 28px 12px; }
    .num-field { text-align: center; margin: 8px 0 18px; min-height: 48px; }

    .num-field .val { font-size: 28px; font-weight: 600; letter-spacing: .02em; }
    .num-field .under { width: 88px; height: 2px; background: var(--violet); margin: 8px auto 0; border-radius: 2px; }
    .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex: 1; }
    .key {
      background: var(--card); border: 1px solid rgba(139,92,246,.28);
      border-radius: 16px; color: #fff; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 58px;
    }
    .key b { font-size: 26px; font-weight: 500; line-height: 1; }
    .key span { font-size: 10px; color: var(--grey); letter-spacing: .12em; margin-top: 4px; }
    .dial-actions {
      display: grid; grid-template-columns: 48px 1fr 48px; gap: 16px;
      align-items: center; margin: 16px 8px 4px;
    }
    .round {
      width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
      background: var(--violet); color: #fff; display: grid; place-items: center;
    }
    .call-go {
      height: 56px; border-radius: 999px; border: 0; cursor: pointer;
      background: var(--green); color: #fff; display: grid; place-items: center;
    }
    .call {
      flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center;
      padding: 6px 20px 16px;
      background: radial-gradient(circle at 50% 28%, rgba(139,92,246,.35), transparent 55%), var(--app);

    .min {
      align-self: flex-start; background: var(--card); border: 0; color: #fff;
      border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .call-top {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      margin: 16px 0 8px; font-weight: 650;
    }
    .active {
      border: 1px solid var(--green); color: #4ade80; border-radius: 999px;
      padding: 4px 10px; font-size: 12px; font-weight: 650;
    }
    .call-av {
      width: 88px; height: 88px; border-radius: 50%; background: var(--card);
      display: grid; place-items: center; font-size: 36px; font-weight: 600; margin-top: 10px;
    }
    .call-id { font-size: 22px; font-weight: 650; margin-top: 12px; letter-spacing: -.02em; text-align: center; }
    .timer { color: var(--grey); margin-top: 6px; font-size: 16px; }
    .call-ctrls { display: flex; gap: 22px; margin-top: auto; margin-bottom: 18px; flex-shrink: 0; }
    .ctrl { background: none; border: 0; color: var(--grey); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; }
    .ctrl i {
      width: 56px; height: 56px; border-radius: 50%; background: rgba(26,24,32,.85);
      display: grid; place-items: center; color: #fff;

    .ctrl.on i { background: #fff; color: #111; }
    .hang {
      width: 68px; height: 68px; flex-shrink: 0; z-index: 3; margin-bottom: 4px;
      border-radius: 50%; border: 0; background: var(--red);
      color: #fff; display: grid; place-items: center; cursor: pointer;
    }

    .scrim {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 12;

    .scrim.on { opacity: 1; pointer-events: auto; }
    .drawer {
      position: absolute; inset: 0; width: 100%; z-index: 13;

    .d-av {

    .label { color: var(--grey); font-size: 11px; letter-spacing: .14em; margin: 8px 4px; }
    .prod {

    .prod .pa {

    .d-foot {
      margin-top: auto; display: flex; justify-content: space-around;
      padding: 16px 8px max(12px, env(safe-area-inset-bottom));
      flex-shrink: 0;
    }
    .d-foot button {
      background: none; border: 0; color: var(--grey); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px;

    .d-foot i {

    .cta-pop {
      position: absolute; left: 12px; right: 12px; bottom: 18px; z-index: 14;

      border-radius: 18px; padding: 14px; text-align: center;

    .mob-get {

    @media (max-height: 860px) {

    }
    @media (max-width: 900px) {
      nav, .stage-copy { display: none; }
      .mob-get { display: flex; }
      .stage { padding: 0; }
      .phone-wrap { width: 100%; height: calc(100dvh - 78px); max-height: none; aspect-ratio: auto; min-height: 0; }
      .phone { border-radius: 0; border: 0; box-shadow: none; }
      .app { inset: 0; border-radius: 0; }
      .island { display: none; }
    }
  </style>
</head>

          { k: "in", t: "No SIM. No number on a bill.", at: "10:50" },
          { k: "in", t: "I just picked a new identity for this.", at: "10:51" },
          { k: "out", t: "Ok I'm downloading this for the team.", at: "10:52" },
          { k: "in", t: "You can run your own version too.", at: "10:53" },
          { k: "in", t: "The brand is yours. Arnacon only enables it.", at: "10:54" },
          { k: "out", t: "Calling you now.", at: "10:55" },
          { k: "pill", t: "Outgoing call", at: "10:55" },
          { k: "in", t: "Want to hop on a call as the email?", at: "11:02" },
          { k: "out", t: "Already did. Worked first try.", at: "11:03" },
          { k: "in", t: "Done. See you on the other identity.", at: "11:04" }
        ]
      },
      "*9225": { snip: "Outgoing call", when: "22 Jun", msgs: [{ k: "chip", t: "22/06/2026" }, { k: "pill", t: "Outgoing call", at: "09:12" }] },
      "northline.ops": { snip: "Incoming call", when: "19 Jun", msgs: [{ k: "chip", t: "19/06/2026" }, { k: "pill", t: "Incoming call", at: "16:40" }] }
    };
    const replies = [
      "Call me as you@mail.com — no number.",
      "Encrypted end to end.",
      "Switch identity whenever the context changes.",
      "No SIM. No number on a bill.",
      "I just picked a new identity for this.",
      "You can run your own version too.",
      "The brand is yours. Arnacon only enables it.",
      "Want to hop on a call as the email?",
      "Done. See you on the other identity.",
      "Your email is the number. That's it.",
      "Work identity, friends identity — never mixed.",
      "Drop the number. Keep the conversation."
    ];
    let me = products[0].id;
    let tab = "chats";
    let screen = "chats";
    let threadId = null;
    let dial = "";
    let callFor = null;
    let callT = 0, callIv = null, muted = false, speaker = false;
    const svg = {
      phone: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.7 3.9 5.1 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11 11 0 0 0 3.5.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 7a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11 11 0 0 0 .56 3.5 1 1 0 0 1-.24 1z"/></svg>',
      back: '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
      cam: '<svg width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8 7l1.4-2h5.2L16 7"/></svg>',
      send: '<svg width="16" height="16" fill="#fff" viewBox="0 0 24 24"><path d="M3 11.5 21 3l-7.2 18-2.6-7.2L3 11.5z"/></svg>',
      chat: '<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M5 18.5 4 22l3.6-1.4A9 9 0 1 0 5 18.5z"/></svg>',
      grid: '<svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>',
      plane: '<svg width="16" height="16" fill="#fff" viewBox="0 0 24 24"><path d="M3 11.5 21 3l-7.2 18-2.6-7.2L3 11.5z"/></svg>',
      del: '<svg width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 8v8M8 10l4 6 4-6"/><path d="M4 7h13l3 5-3 5H4l3-5-3-5z"/></svg>',
      bs: '<svg width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" viewBox="0 0 24 24"><path d="M10 6H20a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10L4 12l6-6z"/><path d="m13 9 5 6M18 9l-5 6"/></svg>',
      mic: '<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>',
      spk: '<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 7a7 7 0 0 1 0 10"/></svg>',
      hang: '<svg width="28" height="28" fill="#fff" viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.7 3.9 5.1 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11 11 0 0 0 3.5.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 7a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11 11 0 0 0 .56 3.5 1 1 0 0 1-.24 1z"/></svg>',
      copy: '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4h12"/></svg>',
      gear: '<svg width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',
      down: '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
    };
    function initial(s){ s=String(s); return /[0-9]/.test(s[0]) ? s[0] : (s[0]==="*" ? "*" : s[0].toUpperCase()); }
    function now(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
    $("clock").textContent = now();
    setInterval(()=> $("clock").textContent = now(), 30000);
    function tabs(){
      return `<nav class="tabs">
        <button class="tab ${tab==="chats"?"on":""}" data-tab="chats">${svg.chat}<span>Chats</span></button>
        <button class="tab ${tab==="dialer"?"on":""}" data-tab="dialer">${svg.grid}<span>Dialer</span></button>
      </nav>`;
    }
    function idbar(){
      return `<div class="idbar"><button class="ham" id="ham" aria-label="Identities"><span></span></button><div class="ident">${me}</div></div>`;
    }
    function renderDrawer(){
      $("drawer").innerHTML = `
        <div class="d-av">${initial(me)}${/[0-9]/.test(me[1]||"")?me[1]:""}</div>
        <div class="d-id">${me}</div>
        <div class="d-active"><i></i> Active</div>
        <div class="label">YOUR PRODUCTS</div>
        ${products.map(p=>`<div class="prod ${p.id===me?"on":""}" data-id="${p.id}">
          <div class="pa">${initial(p.id)}</div><span>${p.id}</span>
          <button class="copy" data-copy="${p.id}" aria-label="Copy">${svg.copy}</button>
        </div>`).join("")}
        <div class="d-foot">
          <button type="button"><i>${svg.gear}</i>Settings</button>
          <button type="button"><i>${svg.cam}</i>Scan</button>
        </div>`;
    }
    function openDrawer(on){
      $("drawer").classList.toggle("on", on);
      $("scrim").classList.toggle("on", on);
      if (on) renderDrawer();
    }
    function renderChats(){
      const rows = Object.entries(chats).map(([id,c])=>`
        <div class="row" data-open="${id}">
          <div class="avatar">${initial(id)}</div>
          <div><div class="name">${id}</div><div class="snip">${c.snip}</div></div>
          <div class="when">${c.when}</div>
          <button class="call-mini" data-call="${id}" aria-label="Call">${svg.phone}</button>
        </div>`).join("");
      $("view").innerHTML = idbar()+`<div class="list">${rows}</div>`+tabs();
    }
    function renderThread(){
      const c = chats[threadId];
      const msgs = c.msgs.map(m=>{
        if (m.k==="chip") return `<div class="chip">${m.t}</div>`;
        if (m.k==="pill") return `<div class="pill">${m.t}<small>${m.at||""}</small></div>`;
        if (m.k==="out") return `<div class="bubble out">${m.t}<span class="t">${m.at}</span></div>`;
        return `<div class="bubble in"><div class="from">${threadId}</div>${m.t}<span class="t">${m.at}</span></div>`;
      }).join("");
      $("view").innerHTML = idbar()+`
        <div class="thread-nav">
          <button class="icon-btn left" id="back">${svg.back}</button>
          <div class="who">${threadId}</div>
          <button class="icon-btn right" data-call="${threadId}">${svg.phone}</button>
        </div>
        <div class="thread" id="thread">${msgs}</div>
        <form class="composer" id="composer">
          <button class="cam" type="button" aria-label="Camera">${svg.cam}</button>
          <input name="m" placeholder="Type a message..." autocomplete="off" />
          <button class="send" type="submit" aria-label="Send">${svg.send}</button>
        </form>`;
      const th = $("thread"); th.scrollTop = th.scrollHeight;
    }
    function renderDialer(){
      const keys = [["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"],["*",""],["0","+"],["#",""]];
      $("view").innerHTML = idbar()+`
        <div class="dialer">
          <div class="num-field">${dial?`<div class="val">${dial}</div>`:`<div class="ph">Enter number</div>`}<div class="under"></div></div>
          <div class="keys">${keys.map(([n,l])=>`<button class="key" data-key="${n}"><b>${n}</b>${l?`<span>${l}</span>`:""}</button>`).join("")}</div>
          <div class="dial-actions">
            <button class="round" data-msg-dial aria-label="Message">${svg.plane}</button>
            <button class="call-go" data-call-dial aria-label="Call">${svg.phone}</button>
            <button class="round" data-bs aria-label="Delete">${svg.bs}</button>
          </div>
        </div>`+tabs();
    }
    function startCall(who){
      callFor = who; callT = 0; muted = false; speaker = false;
      screen = "call";
      if (callIv) clearInterval(callIv);
      callIv = setInterval(()=>{ callT++; const el=document.getElementById("timer"); if(el) el.textContent = fmt(callT); }, 1000);
      renderCall();
    }
    function fmt(s){ return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
    function renderCall(){
      $("view").innerHTML = `
        <div class="call">
          <button class="min" id="min">${svg.down} Minimize</button>
          <div class="call-top"><span>${callFor}</span><span class="active">Active</span></div>
          <div class="call-av">${initial(callFor)}</div>
          <div class="call-id">${callFor}</div>
          <div class="timer" id="timer">${fmt(callT)}</div>
          <div class="call-ctrls">
            <button class="ctrl" data-noop><i>${svg.grid}</i>Keypad</button>
            <button class="ctrl ${muted?"on":""}" id="mute"><i>${svg.mic}</i>Mute</button>
            <button class="ctrl ${speaker?"on":""}" id="spk"><i>${svg.spk}</i>Speaker</button>
          </div>
          <button class="hang" id="hang" aria-label="Hang up">${svg.hang}</button>
        </div>`;
    }
    function hang(){
      if (callIv) clearInterval(callIv);
      if (callFor && chats[callFor]) chats[callFor].msgs.push({k:"pill", t:"Outgoing call", at: now()});
      callFor = null; screen = threadId ? "thread" : (tab==="dialer"?"dialer":"chats");
      render(); $("cta").classList.add("on");
      setTimeout(()=> $("cta").classList.remove("on"), 8000);
    }
    function render(){
      openDrawer(false);
      if (screen==="call") return renderCall();
      if (screen==="thread") return renderThread();
      if (tab==="dialer") return renderDialer();
      renderChats();
    }
    document.getElementById("app").addEventListener("click", e=>{
      const ham = e.target.closest("#ham"); if (ham) { openDrawer(true); return; }
      if (e.target.closest("#scrim")) { openDrawer(false); return; }
      const prod = e.target.closest(".prod");
      if (prod && !e.target.closest(".copy")) { me = prod.dataset.id; openDrawer(false); render(); return; }
      const cp = e.target.closest("[data-copy]");
      if (cp) { navigator.clipboard && navigator.clipboard.writeText(cp.dataset.copy); return; }
      const tb = e.target.closest("[data-tab]");
      if (tb) { tab = tb.dataset.tab; screen = tab; threadId=null; render(); return; }
      const call = e.target.closest("[data-call]");
      if (call) { startCall(call.dataset.call); return; }
      const open = e.target.closest("[data-open]");
      if (open && !e.target.closest("[data-call]")) { threadId = open.dataset.open; screen="thread"; tab="chats"; render(); return; }
      if (e.target.closest("#back")) { screen="chats"; threadId=null; render(); return; }
      const key = e.target.closest("[data-key]");
      if (key) { dial += key.dataset.key; renderDialer(); return; }
      if (e.target.closest("[data-bs]")) { dial = dial.slice(0,-1); renderDialer(); return; }
      if (e.target.closest("[data-call-dial]")) { startCall(dial || "you@mail.com"); return; }
      if (e.target.closest("[data-msg-dial]")) {
        const id = dial || "you@mail.com";
        if (!chats[id]) chats[id] = { snip: "New chat", when: "now", msgs: [{k:"chip", t: now()}] };
        threadId = id; tab="chats"; screen="thread"; render(); return;
      }
      if (e.target.closest("#hang") || e.target.closest("#min")) { hang(); return; }
      if (e.target.closest("#mute")) { muted=!muted; renderCall(); return; }
      if (e.target.closest("#spk")) { speaker=!speaker; renderCall(); return; }
    });
    document.getElementById("app").addEventListener("submit", e=>{
      if (e.target.id!=="composer") return;
      e.preventDefault();
      const input = e.target.m;
      const text = (input.value||"").trim(); if (!text) return;
      chats[threadId].msgs.push({k:"out", t:text, at: now()});
      chats[threadId].snip = text;
      input.value = "";
      renderThread();
      setTimeout(()=>{
        const r = replies[Math.floor(Math.random()*replies.length)];
        chats[threadId].msgs.push({k:"in", t:r, at: now()});
        chats[threadId].snip = r;
        renderThread();
      }, 700);
    });
    render();
  </script>
</body>
</html>
